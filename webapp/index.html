<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BitCat Watch</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light dark;
    --fg: #14130e;
    --dim: #77756c;
    --line: #14130e;
    --panel: #efeee7;
    --paper: #faf9f4;
    --acc: #3d6fb4;
    /* Texto sobre el acento: el azul claro y el oscuro necesitan tintas opuestas
       para que el boton siga siendo legible en los dos temas. */
    --acc-fg: #faf9f4;
    --ok: #2d7a4c;
    --err: #b8433a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #eceae4;
      --dim: #8b897f;
      --line: #eceae4;
      --panel: #1a1a19;
      --paper: #0e0e0d;
      --acc: #6fa8e0;
      --acc-fg: #14130e;
      --ok: #6fc48f;
      --err: #e58279;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0 auto;
    max-width: 27rem;
    /* env(safe-area-*) importa al instalarla: en modo standalone la pagina
       llega hasta la muesca y la barra de gestos. */
    padding: calc(1.75rem + env(safe-area-inset-top)) calc(1.1rem + env(safe-area-inset-right))
             calc(3rem + env(safe-area-inset-bottom)) calc(1.1rem + env(safe-area-inset-left));
    background: var(--paper);
    color: var(--fg);
    font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
  }

  h1 {
    margin: 0 0 1.5rem;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3em;
    color: var(--acc);
  }

  /* --- cabecera: BitCat es el indicador de estado --- */
  header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
  canvas { flex: none; image-rendering: pixelated; }
  #estado {
    font-size: 17px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
  }
  #desde { margin: .3rem 0 0; font-size: 12px; color: var(--dim); }

  /* --- botones con sombra dura, sin curvas --- */
  button {
    font: inherit; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    width: 100%; padding: .8rem; margin-bottom: .85rem;
    border: 2px solid var(--line); border-radius: 0;
    background: var(--acc); color: var(--acc-fg);
    box-shadow: 4px 4px 0 var(--line);
    cursor: pointer;
  }
  button.sec { background: transparent; color: var(--fg); }
  button[hidden] { display: none; }
  button:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: none; }
  button:disabled {
    opacity: .3; cursor: default;
    box-shadow: 4px 4px 0 var(--dim); border-color: var(--dim);
  }

  /* --- datos --- */
  dl { margin: 1.75rem 0 0; }
  .fila {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: .75rem; padding: .45rem 0;
    border-bottom: 2px dotted var(--line);
  }
  dt { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  dd { margin: 0; font-size: 14px; font-weight: 700; text-align: right; }

  /* --- firmware --- */
  input[type=file] {
    display: block; width: 100%; margin-bottom: .85rem;
    padding: .55rem;
    border: 2px dashed var(--line); border-radius: 0;
    background: transparent; color: var(--dim);
    font: inherit; font-size: 11.5px;
  }
  input[type=file]::file-selector-button {
    font: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    margin-right: .6rem; padding: .3rem .6rem;
    border: 2px solid var(--line); border-radius: 0;
    background: transparent; color: var(--fg);
    cursor: pointer;
  }
  #progreso {
    height: 16px; margin-bottom: .85rem;
    border: 2px solid var(--line);
    background: var(--panel);
  }
  #progreso[hidden] { display: none; }
  #barra { height: 100%; width: 0; background: var(--acc); }
  #pie {
    margin: 1.2rem 0 0; text-align: center;
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--dim);
  }

  /* --- dos pantallas que se pasan deslizando --- */
  #pestanas { display: flex; gap: .5rem; margin-bottom: 1.2rem; }
  #pestanas button {
    margin: 0; padding: .5rem .2rem;
    font-size: 11px; letter-spacing: .12em;
    background: transparent; color: var(--dim);
    border-color: var(--dim); box-shadow: 3px 3px 0 var(--dim);
  }
  #pestanas button.on {
    background: var(--acc); color: var(--acc-fg);
    border-color: var(--line); box-shadow: 3px 3px 0 var(--line);
  }

  /*
   * El carrusel se sale del ancho del body para que cada pantalla ocupe el
   * hueco entero con su propio margen, y no quede una franja muerta a los lados
   * al deslizar.
   */
  #paginas {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    /* El deslizamiento vertical tiene que seguir funcionando dentro de cada
       pantalla; sin esto el navegador se queda tambien con el vertical. */
    touch-action: pan-x pan-y;
  }
  #paginas::-webkit-scrollbar { display: none; }
  .pagina {
    flex: 0 0 100%;
    scroll-snap-align: start;
    /* Sin esto, un hijo ancho (la consola, una linea larga del log) estira la
       columna y las dos pantallas dejan de medir lo mismo. */
    min-width: 0;
    padding: 2px;   /* deja ver la sombra dura de los botones */
  }

  /* --- editor de animacion --- */
  #lienzo {
    display: block; width: 100%; height: auto;
    margin-bottom: .85rem;
    border: 2px solid var(--line);
    background: var(--panel);
    /* Sin esto el navegador se queda el gesto para desplazar la pagina y no
       llega ni un solo trazo. */
    touch-action: none;
    cursor: crosshair;
  }
  .tira { display: flex; gap: .5rem; margin-bottom: .85rem; }
  .tira button { margin: 0; padding: .55rem .2rem; font-size: 11px; letter-spacing: .08em; }
  .tira button.on { background: var(--acc); color: var(--acc-fg); }
  .cuadro { position: relative; }
  .cuadro .n {
    position: absolute; top: -2px; right: 2px;
    font-size: 8px; color: var(--dim);
  }
  #velocidad { width: 100%; margin: 0 0 .85rem; accent-color: var(--acc); }
  .par { display: flex; gap: .5rem; }
  .par button { margin-bottom: .85rem; }

  /* --- actividad y detalles tecnicos --- */
  h2 {
    margin: 1.9rem 0 .55rem;
    font-size: 11px; font-weight: 700;
    letter-spacing: .2em; color: var(--dim);
  }

  /* Lo que le pasa al usuario: en su idioma, sin hora ni etiquetas. Crece con
     lo que haya, en vez de reservar una caja fija que casi siempre sale vacia. */
  #actividad {
    max-height: 9rem; overflow-y: auto;
    padding: .65rem .75rem;
    border: 2px solid var(--line);
    background: var(--panel);
    font-size: 12px; line-height: 1.75;
  }
  .ev { display: flex; gap: .55rem; }
  .ev::before { content: '·'; flex: none; color: var(--dim); }
  .ev.ok::before  { content: '✓'; color: var(--ok); }
  .ev.err::before { content: '!'; color: var(--err); font-weight: 700; }
  .ev.err { color: var(--err); }
  .ev span { word-break: break-word; }

  /* El diagnostico vive plegado: solo se abre cuando algo va mal. */
  details {
    margin-top: .9rem;
    border: 2px dotted var(--line);
    background: transparent;
  }
  summary {
    padding: .55rem .75rem;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); cursor: pointer;
  }
  summary::marker { color: var(--dim); }
  #nErrores { color: var(--err); }
  #tecnico {
    height: 10rem; overflow-y: auto;
    padding: .5rem .75rem;
    border-top: 2px dotted var(--line);
    font-size: 11px; line-height: 1.75;
  }
  #copiarSoporte { margin: .6rem .75rem .75rem; width: calc(100% - 1.5rem); }
  .ln { display: flex; gap: .55rem; }
  .ln .h { flex: none; color: var(--dim); }
  .ln .g { flex: none; width: 6ch; color: var(--dim); text-transform: uppercase; }
  .ln .m { white-space: pre-wrap; word-break: break-word; }
  .ln.ok  .g { color: var(--ok); }
  .ln.err .g { color: var(--err); }
</style>
</head>
<body>

<h1>BITCAT WATCH</h1>

<header>
  <canvas id="gato" aria-hidden="true"></canvas>
  <div>
    <div id="estado">Desconectado</div>
    <p id="desde">Conecta para poner el reloj en hora</p>
  </div>
</header>

<nav id="pestanas">
  <button data-p="0" class="on">Reloj</button>
  <button data-p="1">Dibujo</button>
</nav>

<div id="paginas">

  <section class="pagina" aria-label="Reloj">
    <button id="primario">Conectar</button>
    <button id="instalar" class="sec" hidden>Instalar app</button>

    <dl>
      <div class="fila"><dt>Hora</dt><dd id="vHora">--</dd></div>
      <div class="fila"><dt>Temp</dt><dd id="vTemp">--</dd></div>
      <div class="fila"><dt>Humedad</dt><dd id="vHum">--</dd></div>
      <div class="fila"><dt>Viento</dt><dd id="vViento">--</dd></div>
      <div class="fila"><dt>Cielo</dt><dd id="vCielo">--</dd></div>
    </dl>

    <h2>FIRMWARE</h2>
    <dl>
      <div class="fila"><dt>En el reloj</dt><dd id="vReloj">--</dd></div>
      <div class="fila"><dt>Publicada</dt><dd id="vPublicada">--</dd></div>
    </dl>
    <div id="progreso" hidden><div id="barra"></div></div>
    <button id="remoto" disabled>Actualizar</button>
  </section>

  <section class="pagina" aria-label="Dibujo">
    <canvas id="lienzo" width="512" height="128"
            aria-label="Lienzo de 128 por 32 pixeles"></canvas>

    <div class="tira" id="tiraCuadros"></div>

    <div class="tira">
      <button id="pincel" class="on">Pintar</button>
      <button id="goma" class="sec">Borrar</button>
      <button id="limpiar" class="sec">Vaciar</button>
    </div>

    <div class="tira">
      <button id="copiar" class="sec">Copiar anterior</button>
      <button id="reproducir" class="sec">Probar</button>
    </div>

    <input type="range" id="velocidad" min="4" max="60" value="15"
           aria-label="Velocidad de la animacion">
    <p id="vVel" class="fila" style="border:0;padding:0;color:var(--dim);font-size:11px">
      <span>150 ms por cuadro</span></p>

    <div class="par">
      <button id="enviarAnim" disabled>Enviar al reloj</button>
      <button id="borrarAnim" class="sec" disabled>Quitar</button>
    </div>
  </section>

</div>

<h2>ACTIVIDAD</h2>
<div id="actividad" role="log" aria-live="polite"></div>

<details id="soporte">
  <summary>Detalles tecnicos <span id="nErrores"></span></summary>
  <div id="tecnico"></div>
  <button id="copiarSoporte" class="sec">Copiar para soporte</button>
</details>

<p id="pie">BitCat Watch</p>

<script>
const SVC  = '5c8b0001-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_TIME     = '5c8b0002-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_WEATHER  = '5c8b0003-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_OTA_CTRL = '5c8b0004-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_OTA_DATA = '5c8b0005-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_INFO     = '5c8b0006-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_ANIM     = '5c8b0007-7a2e-4f1d-9c3a-1b2d4e6f8a90';
const CHR_FORECAST = '5c8b0008-7a2e-4f1d-9c3a-1b2d4e6f8a90';

// Doce horas: lo que cabe legible en los 128 px del reloj.
const FC_HORAS = 12;

// Animacion: 128x32 en cuatro cuadros.
const ANIM_W = 128, ANIM_H = 32, ANIM_PAGES = ANIM_H / 8;
const ANIM_FRAME_BYTES = ANIM_W * ANIM_PAGES;   // 512
const ANIM_FRAMES = 4;
const ANIM_START = 1, ANIM_DATA = 2, ANIM_END = 3, ANIM_BORRAR = 4;
// Deja sitio de sobra bajo cualquier MTU que negocie el celular; son 2 KB en
// total, asi que apurar no ahorraria un tiempo que se note.
const ANIM_CHUNK = 240;

// Cabecera de esp_encrypted_img: el .bin publicado va cifrado, asi que ya no
// empieza con el 0xE9 de las imagenes de ESP-IDF sino con este magico.
const OTA_MAGIC = [0xCF, 0xB6, 0x88, 0x07];

// Ordenes y estados del OTA, iguales a los de main/ble_sync.c.
const OTA_START = 1, OTA_END = 2, OTA_ABORT = 3;
const OTA_LISTO = 1, OTA_PROGRESO = 2, OTA_OK = 3, OTA_ERROR = 4;

// Web Bluetooth no expone el MTU negociado, asi que se prueba el trozo grande y
// se va partiendo a la mitad hasta que el navegador lo acepte.
const OTA_CHUNK_MAX = 512;
const OTA_CHUNK_MIN = 20;

// La hora se reenvía seguido porque corrige la deriva del oscilador del ESP32.
// El clima no: Open-Meteo actualiza cada 15 min, pedirlo más seguido no aporta.
const PERIODO_HORA_MS  = 60 * 1000;
const PERIODO_CLIMA_MS = 10 * 60 * 1000;
const RECONEXION_MIN_MS = 2000;
const RECONEXION_MAX_MS = 30000;

const $ = id => document.getElementById(id);

let device = null, chrTime = null, chrWeather = null;
let chrOtaCtrl = null, chrOtaData = null, chrInfo = null;
let chrAnim = null, chrForecast = null;
let otaEnCurso = false;
let firmwarePublicado = null;
let versionReloj = null;
let desconexionManual = false;
let timers = [];
let esperaReconexion = RECONEXION_MIN_MS;
let reconexionActiva = false;
let ultimaSync = null;

/* --------------------------------------------------------------- bitcat */

// Los mismos sprites que main/bitcat.c, generados con tools/gen_bitcat.py.
// Caminando = el enlace está trabajando; saludando con cara feliz = conectado.
const GATO_CAMINA = [[
  ".......##.............##.......",
  ".......###...........###.......",
  ".......####.........####.......",
  "......###################......",
  "......###################......",
  "......##...............##......",
  "......##..####...####..##......",
  "......##..####...####..##......",
  "......##..####...####..##......",
  "......##..####...####..##......",
  "......##...............##......",
  "......##...............##......",
  "......##...............##......",
  "......###################......",
  "......###################......",
  "....##....###########..........",
  "....##....##.......##..........",
  "....##...#############.........",
  ".....##..#############.........",
  "......##.#############.........",
  ".......###############.........",
  ".........#############.........",
  ".........####....####..........",
  ".........####....####..........",
], [
  ".......##.............##.......",
  ".......###...........###.......",
  ".......####.........####.......",
  "......###################......",
  "......###################......",
  "......##...............##......",
  "......##..####...####..##......",
  "......##..####...####..##......",
  "......##..####...####..##......",
  "......##..####...####..##......",
  "......##...............##......",
  "......##...............##......",
  "......##...............##......",
  "...##.###################......",
  "...##.###################......",
  "...##.....###########..........",
  "....##....##.......##..........",
  ".....##..#############.........",
  "......##.#############.........",
  ".......###############.........",
  ".........#############.........",
  ".........#############.........",
  "..........####....####.........",
  "..........####....####.........",
]];

const GATO_SALUDA = [[
  ".......##.............##.......",
  ".......###...........###.......",
  ".......####.........####.......",
  "......###################.#####",
  "......###################.#####",
  "......##...............##..###.",
  "......##...............##..###.",
  "......##...##.....##...##..###.",
  "......##..#..#...#..#..##..###.",
  "......##...............##..###.",
  "......##...............##..###.",
  "......##...............##..###.",
  "......##...............##..###.",
  "...##.###################..###.",
  "...##.###################..###.",
  "...##.....###########......###.",
  "....##....##.......###########.",
  ".....##..#############.........",
  "......##.#############.........",
  ".......###############.........",
  ".........#############.........",
  ".........#############.........",
  ".........####.....####.........",
  ".........####.....####.........",
], [
  ".......##.............##.......",
  ".......###...........###.......",
  ".......####.........####.......",
  "......###################......",
  "......###################......",
  "......##...............##......",
  "......##...............##.#####",
  "......##...##.....##...##.#####",
  "......##..#..#...#..#..##..###.",
  "......##...............##..###.",
  "......##...............##..###.",
  "......##...............##..###.",
  "......##...............##..###.",
  "...##.###################..###.",
  "...##.###################..###.",
  "...##.....###########......###.",
  "....##....##.......###########.",
  ".....##..#############.........",
  "......##.#############.........",
  ".......###############.........",
  ".........#############.........",
  ".........#############.........",
  ".........####.....####.........",
  ".........####.....####.........",
]];

const GATO_W = 31, GATO_H = 24, PX = 3;
const cv = $('gato'), ctx2d = cv.getContext('2d');
cv.width = GATO_W * PX;
cv.height = GATO_H * PX;
cv.style.width = cv.width + 'px';
cv.style.height = cv.height + 'px';

let cuadros = GATO_CAMINA, animado = false, tick = 0;

function pintarGato() {
  const f = cuadros[animado ? tick % cuadros.length : 0];
  ctx2d.clearRect(0, 0, cv.width, cv.height);
  ctx2d.fillStyle = getComputedStyle(document.body).getPropertyValue('--acc').trim() || '#3d6fb4';
  for (let r = 0; r < GATO_H; r++) {
    for (let c = 0; c < GATO_W; c++) {
      if (f[r][c] === '#') ctx2d.fillRect(c * PX, r * PX, PX, PX);
    }
  }
}
setInterval(() => { if (animado) { tick++; pintarGato(); } }, 260);

/* ------------------------------------------------------------- consola */

// Se construye con nodos y textContent, nunca innerHTML: los mensajes traen
// texto de excepciones del navegador y no hay que interpretarlo como markup.
/*
 * Dos registros con propositos distintos.
 *
 * log() es el diario tecnico: lo apunta todo, con hora y etiqueta, y vive
 * plegado dentro de "Detalles tecnicos". Ahi caben los epoch, los porcentajes
 * del OTA y la cadena de diagnostico del reloj, que no le dicen nada a quien
 * solo quiere ver la hora en la muñeca pero lo son todo cuando algo falla.
 *
 * aviso() es lo que le pasa al usuario, en su idioma y sin jerga. Se llama
 * pocas veces a proposito: si se anotara cada sincronizacion —una por minuto—
 * lo unico que de verdad importa quedaria enterrado.
 *
 * Los errores no hay que acordarse de duplicarlos: log() los sube solo a la
 * lista visible, porque un fallo que solo aparezca dentro de un desplegable
 * cerrado es un fallo que nadie ve.
 */
const historial = [];
let nErrores = 0;

function log(grupo, mensaje, clase = '') {
  const hora = new Date().toTimeString().slice(0, 8);
  historial.push(`${hora} ${grupo.padEnd(6)} ${mensaje}`);

  const ln = document.createElement('div');
  ln.className = 'ln ' + clase;

  const h = document.createElement('span');
  h.className = 'h';
  h.textContent = hora;

  const g = document.createElement('span');
  g.className = 'g';
  g.textContent = grupo;

  // textContent y no innerHTML: aqui acaba texto de excepciones del navegador
  // y de nombres de dispositivo, que no hay que interpretar como markup.
  const m = document.createElement('span');
  m.className = 'm';
  m.textContent = mensaje;

  ln.append(h, g, m);
  $('tecnico').append(ln);
  $('tecnico').scrollTop = $('tecnico').scrollHeight;

  if (clase === 'err') {
    nErrores++;
    $('nErrores').textContent = `· ${nErrores} ${nErrores === 1 ? 'error' : 'errores'}`;
    aviso(mensaje, 'err', false);
  }
}

function aviso(texto, clase = '', tambienTecnico = true) {
  if (tambienTecnico) log('sys', texto, clase);

  const ev = document.createElement('div');
  ev.className = 'ev ' + clase;
  const s = document.createElement('span');
  s.textContent = texto;
  ev.append(s);
  $('actividad').append(ev);
  $('actividad').scrollTop = $('actividad').scrollHeight;
}

/* Todo el diario mas el contexto que siempre se acaba preguntando: que version
   corre en el reloj, cual en la pagina, y en que navegador. */
$('copiarSoporte').onclick = async () => {
  const cabecera = [
    `pagina ${$('pie').textContent}`,
    `reloj ${versionReloj ? versionReloj.version + ' ' + versionReloj.ranura : 'sin conectar'}`,
    navigator.userAgent,
    '',
  ];
  const texto = cabecera.concat(historial).join('\n');
  try {
    await navigator.clipboard.writeText(texto);
    $('copiarSoporte').textContent = 'Copiado';
    setTimeout(() => { $('copiarSoporte').textContent = 'Copiar para soporte'; }, 2000);
  } catch (e) {
    // Sin permiso de portapapeles queda seleccionarlo a mano, que es mejor que
    // no poder sacarlo de aqui de ninguna forma.
    $('copiarSoporte').textContent = 'No se pudo copiar';
    setTimeout(() => { $('copiarSoporte').textContent = 'Copiar para soporte'; }, 2000);
  }
};

/* -------------------------------------------------------------- estado */

const conectado = () => device?.gatt?.connected === true;

// clase: 'on' conectado, 'wait' trabajando, '' inactivo.
function setEstado(texto, clase) {
  $('estado').textContent = texto;

  cuadros = clase === 'on' ? GATO_SALUDA : GATO_CAMINA;
  animado = clase !== '';
  tick = 0;
  pintarGato();

  refrescarOtaUi();
  if (conectado()) {
    $('primario').textContent = 'Desconectar';
    $('primario').disabled = false;
  } else if (reconexionActiva) {
    $('primario').textContent = 'Cancelar';
    $('primario').disabled = false;
  } else {
    $('primario').textContent = 'Conectar';
    $('primario').disabled = clase === 'wait';
  }
}

function refrescarDesde() {
  if (!ultimaSync) return;
  const s = Math.round((Date.now() - ultimaSync) / 1000);
  const txt = s < 60 ? `hace ${s} s`
            : s < 3600 ? `hace ${Math.floor(s / 60)} min`
            : `hace ${Math.floor(s / 3600)} h`;
  $('desde').textContent = 'Sincronizado ' + txt;
}
setInterval(refrescarDesde, 1000);

const CIELO = {
  0: 'Despejado', 1: 'Casi claro', 2: 'Parc nublado', 3: 'Nublado',
  45: 'Niebla', 48: 'Niebla', 51: 'Llovizna', 53: 'Llovizna', 55: 'Llovizna',
  56: 'Llov helada', 57: 'Llov helada', 61: 'Lluvia', 63: 'Lluvia',
  65: 'Lluvia fuerte', 66: 'Lluvia helada', 67: 'Lluvia helada',
  71: 'Nieve', 73: 'Nieve', 75: 'Nieve', 77: 'Nieve',
  80: 'Chubascos', 81: 'Chubascos', 82: 'Aguacero',
  85: 'Nevadas', 86: 'Nevadas', 95: 'Tormenta', 96: 'Tormenta', 99: 'Tormenta',
};

const RUMBOS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const rumbo = g => RUMBOS[Math.round(g / 22.5) % 16];

/* --------------------------------------------------------------- enlace */

function arrancarTimers() {
  pararTimers();
  timers.push(setInterval(() => {
    if (conectado()) sendTime().catch(e => log('err', 'hora: ' + e.message, 'err'));
  }, PERIODO_HORA_MS));
  timers.push(setInterval(() => {
    if (conectado()) sendWeather().catch(e => log('err', 'clima: ' + e.message, 'err'));
  }, PERIODO_CLIMA_MS));
}

function pararTimers() {
  timers.forEach(clearInterval);
  timers = [];
}

// Reutilizada por la conexión inicial y por cada reintento. requestDevice() sí
// exige un gesto del usuario, pero gatt.connect() sobre un dispositivo ya
// autorizado no: por eso la reconexión puede ser automática.
async function abrirGatt(etiqueta) {
  const server  = await device.gatt.connect();
  const service = await server.getPrimaryService(SVC);
  chrTime    = await service.getCharacteristic(CHR_TIME);
  chrWeather = await service.getCharacteristic(CHR_WEATHER);

  // Un reloj con firmware anterior al OTA no tiene estas dos: el resto de la
  // pagina tiene que seguir funcionando igual, que es justo el caso de alguien
  // que va a actualizar por USB por primera vez.
  try {
    chrOtaCtrl = await service.getCharacteristic(CHR_OTA_CTRL);
    chrOtaData = await service.getCharacteristic(CHR_OTA_DATA);
    chrInfo    = await service.getCharacteristic(CHR_INFO);
    await leerVersionReloj();
  } catch (e) {
    chrOtaCtrl = chrOtaData = chrInfo = null;
    versionReloj = null;
    aviso('Este reloj tiene firmware antiguo: no se puede actualizar por bluetooth');
  }

  // En su propio try: la animacion llego despues del OTA, asi que un reloj
  // puede tener lo uno sin lo otro y perder el OTA por esto seria absurdo.
  try {
    chrAnim = await service.getCharacteristic(CHR_ANIM);
  } catch (e) {
    chrAnim = null;
    aviso('Este reloj tiene firmware antiguo: no acepta animaciones');
  }
  refrescarAnimUi();

  try {
    chrForecast = await service.getCharacteristic(CHR_FORECAST);
  } catch (e) {
    chrForecast = null;
    log('clima', 'este firmware no acepta pronostico');
  }

  esperaReconexion = RECONEXION_MIN_MS;
  setEstado('Conectado', 'on');
  log('gatt', `${etiqueta} a ${device.name}`, 'ok');
  aviso(`Reloj ${etiqueta}`, 'ok', false);
  arrancarTimers();
  await syncAll();
}

// Un solo hilo de reintentos a la vez: sin esta bandera, dos desconexiones
// seguidas dejarían dos cadenas corriendo en paralelo.
function programarReconexion() {
  if (reconexionActiva) return;
  reconexionActiva = true;
  reintentar();
}

function reintentar() {
  setTimeout(async () => {
    if (desconexionManual || conectado()) {
      reconexionActiva = false;
      return;
    }
    try {
      await abrirGatt('reconectado');
      reconexionActiva = false;
    } catch (e) {
      // Backoff exponencial: si el reloj está apagado o fuera de alcance, no
      // tiene sentido insistir cada 2 s indefinidamente.
      esperaReconexion = Math.min(esperaReconexion * 2, RECONEXION_MAX_MS);
      log('gatt', `sin respuesta, reintento en ${esperaReconexion / 1000} s`);
      // Si el enlace quedó abierto pero el servicio no se pudo leer, hay que
      // cerrarlo: el handler de desconexión reprograma la cadena.
      if (conectado()) {
        reconexionActiva = false;
        device.gatt.disconnect();
        return;
      }
      reintentar();
    }
  }, esperaReconexion);
}

function alDesconectar() {
  pararTimers();
  chrAnim = null;
  chrForecast = null;
  refrescarAnimUi();
  if (desconexionManual) {
    setEstado('Desconectado', '');
    log('gatt', 'desconectado por el usuario');
    aviso('Reloj desconectado', '', false);
    return;
  }
  log('gatt', 'enlace perdido', 'err');
  programarReconexion();
  setEstado('Reconectando', 'wait');
}

async function conectar() {
  if (!navigator.bluetooth) {
    log('err', 'Este navegador no soporta bluetooth. Usa Chrome en Android.', 'err');
    setEstado('No disponible', '');
    return;
  }
  try {
    setEstado('Buscando', 'wait');
    log('sys', 'buscando dispositivos con el servicio del reloj');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }],
      optionalServices: [SVC],
    });
    device.addEventListener('gattserverdisconnected', alDesconectar);
    desconexionManual = false;
    setEstado('Conectando', 'wait');
    await abrirGatt('conectado');
  } catch (e) {
    log('err', e.message, 'err');
    setEstado('Desconectado', '');
    // Enlace abierto pero servicio ilegible: cerrarlo para no quedar a medias.
    if (conectado()) device.gatt.disconnect();
  }
}

function desconectar() {
  desconexionManual = true;
  reconexionActiva = false;
  pararTimers();
  if (conectado()) {
    device.gatt.disconnect();
  } else {
    setEstado('Desconectado', '');
    log('sys', 'reconexion cancelada');
  }
}

$('primario').onclick = () => (conectado() || reconexionActiva ? desconectar() : conectar());

/* ----------------------------------------------------------- protocolo */

async function sendTime() {
  if (!chrTime || !conectado()) throw new Error('sin conexion');
  const now = new Date();
  const epoch = Math.floor(now.getTime() / 1000);
  // getTimezoneOffset() son minutos hacia UTC; el firmware quiere segundos desde UTC.
  const offset = -now.getTimezoneOffset() * 60;

  const buf = new DataView(new ArrayBuffer(8));
  buf.setUint32(0, epoch, true);    // little-endian
  buf.setInt32(4, offset, true);
  await chrTime.writeValue(buf);

  const h = Math.trunc(offset / 3600);
  $('vHora').textContent = now.toLocaleTimeString();
  ultimaSync = Date.now();
  refrescarDesde();
  log('hora', `enviada epoch=${epoch} utc${h >= 0 ? '+' : ''}${h}`, 'ok');
}

function coords() {
  return new Promise((resolve, reject) =>
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      e => reject(new Error('ubicacion: ' + e.message)),
      { timeout: 10000, maximumAge: 600000 }
    ));
}

async function sendWeather() {
  if (!chrWeather || !conectado()) throw new Error('sin conexion');
  const { lat, lon } = await coords();
  log('clima', `consultando open-meteo ${lat.toFixed(3)},${lon.toFixed(3)}`);

  // El pronostico sale de la misma peticion: el endpoint ya era /forecast y solo
  // pedia el momento actual, asi que las proximas horas salen gratis.
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}`
            + `&longitude=${lon.toFixed(4)}`
            + `&current=temperature_2m,relative_humidity_2m,weather_code`
            + `,wind_speed_10m,wind_direction_10m`
            + `&hourly=temperature_2m,precipitation_probability`
            + `&forecast_days=2&timezone=auto`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('open-meteo HTTP ' + r.status);
  const j = await r.json();
  const c = j.current;

  const byte = v => Math.max(0, Math.min(255, Math.round(v ?? 0)));
  const buf = new DataView(new ArrayBuffer(6));
  buf.setInt16(0, Math.round(c.temperature_2m * 10), true);
  buf.setUint8(2, byte(c.relative_humidity_2m));
  buf.setUint8(3, byte(c.weather_code));
  buf.setUint8(4, byte(c.wind_speed_10m));          // km/h
  buf.setUint8(5, byte(c.wind_direction_10m / 2));  // grados / 2, para caber en un byte
  await chrWeather.writeValue(buf);

  $('vTemp').textContent   = `${c.temperature_2m} °C`;
  $('vHum').textContent    = `${c.relative_humidity_2m} %`;
  $('vViento').textContent = `${Math.round(c.wind_speed_10m)} km/h ${rumbo(c.wind_direction_10m)}`;
  $('vCielo').textContent  = CIELO[c.weather_code] ?? `wmo ${c.weather_code}`;
  ultimaSync = Date.now();
  refrescarDesde();

  log('clima', `enviado ${c.temperature_2m}C ${c.relative_humidity_2m}% `
            + `wmo=${c.weather_code} viento=${Math.round(c.wind_speed_10m)}km/h@${c.wind_direction_10m}`, 'ok');

  await sendForecast(j);
}

/*
 * Doce horas a partir de la siguiente en punto.
 *
 * Se busca la hora de arranque comparando con la del reloj del celular en vez de
 * fiarse de que el primer elemento sea "ahora": open-meteo devuelve el dia
 * entero desde las 00:00, asi que a media tarde las primeras entradas ya
 * pasaron. Por eso tambien se piden dos dias, para que a las 23:00 sigan
 * quedando doce por delante.
 */
async function sendForecast(j) {
  if (!chrForecast) return;
  const h = j.hourly;
  if (!h || !Array.isArray(h.time)) return;

  const ahora = Date.now();
  let i0 = h.time.findIndex(t => new Date(t).getTime() > ahora);
  if (i0 < 0) return;

  const n = Math.min(FC_HORAS, h.time.length - i0);
  if (n < 2) return;

  const p = new Uint8Array(2 + 2 * n);
  p[0] = n;
  p[1] = new Date(h.time[i0]).getHours();
  for (let i = 0; i < n; i++) {
    // Grados enteros con signo, recortados al rango de un byte: -128..127 cubre
    // cualquier sitio habitado con mucho margen.
    const t = Math.max(-128, Math.min(127, Math.round(h.temperature_2m[i0 + i] ?? 0)));
    p[2 + i * 2] = t < 0 ? t + 256 : t;
    p[3 + i * 2] = Math.max(0, Math.min(100,
                     Math.round(h.precipitation_probability?.[i0 + i] ?? 0)));
  }
  await escribirCon(chrForecast, p);

  const lluvia = Math.max(...Array.from({length: n}, (_, i) => p[3 + i * 2]));
  log('clima', `pronostico ${n} h desde las ${p[1]}:00, lluvia max ${lluvia}%`, 'ok');
}

async function syncAll() {
  setEstado('Sincronizando', 'wait');
  try {
    await sendTime();
    // El clima no debe tumbar la hora: si falla la ubicación o la red, se avisa
    // y ya se envió lo importante.
    try {
      await sendWeather();
    } catch (e) {
      log('err', 'clima: ' + e.message, 'err');
    }
  } catch (e) {
    log('err', e.message, 'err');
  } finally {
    if (conectado()) setEstado('Conectado', 'on');
    else setEstado('Desconectado', '');
  }
}

/* ------------------------------------------------------------------- ota */

// Compara "1.2.10" con "1.2.9" por numero, no por texto: alfabeticamente el 10
// va antes que el 9 y la pagina diria que hay que retroceder.
function versionMayor(a, b) {
  const pa = String(a).split('.').map(Number);
  const pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x > y;
  }
  return false;
}

function refrescarOtaUi() {
  const enlace = conectado() && chrOtaCtrl && !otaEnCurso;
  const hayQue = firmwarePublicado && versionReloj
              && versionMayor(firmwarePublicado.version, versionReloj.version);

  $('vReloj').textContent = versionReloj
    ? `${versionReloj.version} (${versionReloj.ranura})`
    : '--';

  if (!firmwarePublicado) {
    $('remoto').textContent = 'Sin firmware publicado';
    $('remoto').disabled = true;
    return;
  }
  if (versionReloj && !hayQue) {
    $('remoto').textContent = 'Ya esta al dia';
    $('remoto').disabled = true;
    return;
  }
  $('remoto').textContent = hayQue
    ? `Actualizar a ${firmwarePublicado.version}`
    : 'Actualizar';
  $('remoto').disabled = !enlace;
}

async function leerVersionReloj() {
  const v = await chrInfo.readValue();
  const texto = new TextDecoder().decode(v).trim();   // "1.1.7 app0 mov=42"
  const [version, ranura] = texto.split(' ');
  versionReloj = { version, ranura: ranura || '?' };
  // Se registra la cadena entera, no solo lo que se parsea: ahi viaja el
  // contador de movimientos del sensor, que es como se afinan sus umbrales sin
  // cable de por medio.
  log('info', texto);
  refrescarOtaUi();
}

/* -------------------------------------------------- las dos pantallas --- */

/*
 * El carrusel es un contenedor con scroll horizontal y ajuste por pantalla, no
 * un mostrar/ocultar: asi el deslizamiento del dedo lo lleva el navegador, con
 * su inercia y su rebote, en vez de tener que reinventarlo con eventos de
 * puntero. Las pestañas son el otro camino, y hacen falta: sobre el lienzo el
 * dedo esta dibujando, asi que ahi no se puede deslizar para volver.
 */
const pager = $('paginas');
const pestanas = [...$('pestanas').children];

function marcarPestana(i) {
  pestanas.forEach((b, j) => { b.className = j === i ? 'on' : ''; });
}

function irA(i) {
  /* Se marca aqui y no solo al oir el scroll: el evento de scroll llega con el
     ritmo del pintado, asi que al pulsar la pestaña tardaria en encenderse lo
     que dure la animacion, y en una pestaña eso se lee como que no funciono. */
  marcarPestana(i);
  pager.scrollTo({left: pager.clientWidth * i, behavior: 'smooth'});
}

pestanas.forEach((b, i) => { b.onclick = () => irA(i); });

/* Y al deslizar con el dedo, que ahi no ha pasado por irA(). */
pager.addEventListener('scroll', () => {
  marcarPestana(Math.round(pager.scrollLeft / pager.clientWidth));
}, {passive: true});

/* ------------------------------------------------ editor de animacion --- */

/*
 * Cada cuadro es un pixel por byte mientras se dibuja, que es comodo de tocar, y
 * solo se empaqueta al formato del reloj justo antes de enviarlo.
 */
const cuadrosAnim = Array.from({length: ANIM_FRAMES},
                               () => new Uint8Array(ANIM_W * ANIM_H));
let cuadroActual = 0;
let herramienta = 1;          // 1 = pintar, 0 = borrar
let previa = null;            // temporizador de la reproduccion
let enviandoAnim = false;

const lz = $('lienzo'), lzx = lz.getContext('2d');
const ESCALA = lz.width / ANIM_W;   // 4 px de pantalla por pixel del reloj

const GUARDADO = 'bitcat-anim';

function guardarLocal() {
  try {
    localStorage.setItem(GUARDADO, JSON.stringify({
      v: 1,
      vel: +$('velocidad').value,
      cuadros: cuadrosAnim.map(c => Array.from(c)),
    }));
  } catch (e) { /* modo privado o sin espacio: el dibujo se pierde y ya */ }
}

function cargarLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(GUARDADO) || 'null');
    if (!d || d.v !== 1 || !Array.isArray(d.cuadros)) return;
    d.cuadros.forEach((c, i) => {
      if (i < ANIM_FRAMES && c.length === ANIM_W * ANIM_H) cuadrosAnim[i].set(c);
    });
    if (d.vel) $('velocidad').value = d.vel;
  } catch (e) { /* dato viejo o corrupto: se empieza en blanco */ }
}

function pintarLienzo(indice = cuadroActual) {
  const css = getComputedStyle(document.body);
  lzx.fillStyle = css.getPropertyValue('--panel');
  lzx.fillRect(0, 0, lz.width, lz.height);

  // Calco del cuadro anterior, muy tenue: sin esta referencia es casi imposible
  // encadenar cuatro dibujos que se muevan de forma continua.
  if (indice === cuadroActual && !previa) {
    const anterior = cuadrosAnim[(cuadroActual + ANIM_FRAMES - 1) % ANIM_FRAMES];
    lzx.globalAlpha = .22;
    lzx.fillStyle = css.getPropertyValue('--fg');
    for (let y = 0; y < ANIM_H; y++)
      for (let x = 0; x < ANIM_W; x++)
        if (anterior[y * ANIM_W + x]) lzx.fillRect(x * ESCALA, y * ESCALA, ESCALA, ESCALA);
    lzx.globalAlpha = 1;
  }

  const c = cuadrosAnim[indice];
  lzx.fillStyle = css.getPropertyValue('--fg');
  for (let y = 0; y < ANIM_H; y++)
    for (let x = 0; x < ANIM_W; x++)
      if (c[y * ANIM_W + x]) lzx.fillRect(x * ESCALA, y * ESCALA, ESCALA, ESCALA);
}

function pintarPestanas() {
  const t = $('tiraCuadros');
  t.innerHTML = '';
  for (let i = 0; i < ANIM_FRAMES; i++) {
    const b = document.createElement('button');
    b.className = i === cuadroActual ? 'on cuadro' : 'sec cuadro';
    b.textContent = i + 1;
    b.onclick = () => { pararPrevia(); cuadroActual = i; pintarPestanas(); pintarLienzo(); };
    t.appendChild(b);
  }
}

/* Coordenada del reloj a partir del evento, con el escalado real del elemento:
   el canvas se estira por CSS al ancho del movil, asi que su tamaño en pantalla
   no es el que tiene en pixeles. */
function pixelDe(ev) {
  const r = lz.getBoundingClientRect();
  return {
    x: Math.floor((ev.clientX - r.left) / r.width * ANIM_W),
    y: Math.floor((ev.clientY - r.top) / r.height * ANIM_H),
  };
}

function poner(x, y) {
  if (x < 0 || x >= ANIM_W || y < 0 || y >= ANIM_H) return;
  cuadrosAnim[cuadroActual][y * ANIM_W + x] = herramienta;
}

/*
 * Une dos posiciones seguidas con una recta. Los eventos de puntero llegan cada
 * varios pixeles cuando arrastras rapido, y sin esto el trazo sale a puntos.
 */
function trazo(a, b) {
  let dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
  let sx = a.x < b.x ? 1 : -1, sy = a.y < b.y ? 1 : -1;
  let err = dx - dy, x = a.x, y = a.y;
  for (;;) {
    poner(x, y);
    if (x === b.x && y === b.y) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx)  { err += dx; y += sy; }
  }
}

let ultimo = null;

lz.addEventListener('pointerdown', ev => {
  pararPrevia();
  lz.setPointerCapture(ev.pointerId);
  ultimo = pixelDe(ev);
  poner(ultimo.x, ultimo.y);
  pintarLienzo();
});

lz.addEventListener('pointermove', ev => {
  if (!ultimo) return;
  const p = pixelDe(ev);
  trazo(ultimo, p);
  ultimo = p;
  pintarLienzo();
});

for (const fin of ['pointerup', 'pointercancel', 'pointerleave']) {
  lz.addEventListener(fin, () => {
    if (!ultimo) return;
    ultimo = null;
    guardarLocal();
  });
}

$('pincel').onclick = () => {
  herramienta = 1;
  $('pincel').className = 'on'; $('goma').className = 'sec';
};
$('goma').onclick = () => {
  herramienta = 0;
  $('goma').className = 'on'; $('pincel').className = 'sec';
};
$('limpiar').onclick = () => {
  pararPrevia();
  cuadrosAnim[cuadroActual].fill(0);
  pintarLienzo(); guardarLocal();
};
$('copiar').onclick = () => {
  pararPrevia();
  cuadrosAnim[cuadroActual].set(cuadrosAnim[(cuadroActual + ANIM_FRAMES - 1) % ANIM_FRAMES]);
  pintarLienzo(); guardarLocal();
};

function pararPrevia() {
  if (!previa) return;
  clearInterval(previa);
  previa = null;
  $('reproducir').textContent = 'Probar';
  pintarLienzo();
}

$('reproducir').onclick = () => {
  if (previa) { pararPrevia(); return; }
  let i = 0;
  $('reproducir').textContent = 'Parar';
  previa = setInterval(() => { pintarLienzo(i); i = (i + 1) % ANIM_FRAMES; },
                       +$('velocidad').value * 10);
};

$('velocidad').oninput = () => {
  $('vVel').firstElementChild.textContent = `${$('velocidad').value * 10} ms por cuadro`;
  if (previa) { const v = $('reproducir'); pararPrevia(); v.onclick(); }
  guardarLocal();
};

/*
 * Al formato del panel: paginas de ocho pixeles verticales, bit 0 arriba. Es lo
 * que espera el framebuffer del SSD1306, asi que el reloj lo copia tal cual sin
 * convertir nada.
 */
function empaquetar(c) {
  const out = new Uint8Array(ANIM_FRAME_BYTES);
  for (let p = 0; p < ANIM_PAGES; p++)
    for (let x = 0; x < ANIM_W; x++) {
      let b = 0;
      for (let bit = 0; bit < 8; bit++)
        if (c[(p * 8 + bit) * ANIM_W + x]) b |= 1 << bit;
      out[p * ANIM_W + x] = b;
    }
  return out;
}

function refrescarAnimUi() {
  const listo = conectado() && chrAnim && !enviandoAnim && !otaEnCurso;
  $('enviarAnim').disabled = !listo;
  $('borrarAnim').disabled = !listo;
}

$('enviarAnim').onclick = async () => {
  if (!chrAnim) return;
  pararPrevia();
  enviandoAnim = true;
  refrescarAnimUi();

  try {
    const todo = new Uint8Array(ANIM_FRAMES * ANIM_FRAME_BYTES);
    cuadrosAnim.forEach((c, i) => todo.set(empaquetar(c), i * ANIM_FRAME_BYTES));

    const vel = +$('velocidad').value;
    await escribirCon(chrAnim, Uint8Array.of(ANIM_START, ANIM_FRAMES, vel));

    for (let off = 0; off < todo.length; off += ANIM_CHUNK) {
      const trozo = todo.subarray(off, Math.min(off + ANIM_CHUNK, todo.length));
      const p = new Uint8Array(3 + trozo.length);
      p[0] = ANIM_DATA;
      p[1] = off & 0xff;
      p[2] = (off >> 8) & 0xff;
      p.set(trozo, 3);
      await escribirCon(chrAnim, p);
    }

    await escribirCon(chrAnim, Uint8Array.of(ANIM_END));
    log('anim', `enviados ${ANIM_FRAMES} cuadros a ${vel * 10} ms`, 'ok');
    aviso('Animacion enviada al reloj', 'ok', false);
  } catch (e) {
    log('anim', `no se pudo enviar: ${e.message}`, 'err');
  } finally {
    enviandoAnim = false;
    refrescarAnimUi();
  }
};

$('borrarAnim').onclick = async () => {
  if (!chrAnim) return;
  try {
    await escribirCon(chrAnim, Uint8Array.of(ANIM_BORRAR));
    aviso('Animacion quitada del reloj', 'ok');
  } catch (e) {
    log('anim', `no se pudo quitar: ${e.message}`, 'err');
  }
};

cargarLocal();
pintarPestanas();
pintarLienzo();
$('velocidad').oninput();

// El navegador no expone writeValueWithResponse en versiones viejas.
const escribirCon = (chr, d) =>
  chr.writeValueWithResponse ? chr.writeValueWithResponse(d) : chr.writeValue(d);

let otaEspera = null;
let otaPendiente = null;

/*
 * El firmware notifica desde dentro del callback de la escritura, es decir antes
 * de que salga la respuesta ATT. Visto desde aqui, la notificacion puede llegar
 * antes de que se resuelva la promesa del write: si en ese momento nadie la
 * esperaba, antes se perdia y la transferencia moria con "el reloj no
 * respondio". Por eso se guarda la ultima sin reclamar.
 */
function onOtaNotify(ev) {
  const v = ev.target.value;
  const dato = { estado: v.getUint8(0), recibido: v.getUint32(1, true), err: v.getUint8(5) };

  // El avance es informativo; solo los cambios de fase desbloquean el envio.
  if (dato.estado === OTA_PROGRESO) {
    log('ota', `el reloj confirma ${Math.round(dato.recibido / 1024)} KB`);
    return;
  }
  // El reloj manda su motivo aunque nadie lo este esperando. Antes se quedaba
  // guardado sin que nadie lo leyera, y era justo el dato que hacia falta.
  if (dato.estado === OTA_ERROR) {
    const causa = {1: 'no pudo preparar la ranura', 2: 'la imagen no valido',
                   3: 'cancelado', 4: 'no pudo escribir o descifrar'}[dato.err];
    log('err', `el reloj informa: ${causa || 'error ' + dato.err}`, 'err');
  }
  if (otaEspera) {
    const resolver = otaEspera;
    otaEspera = null;
    resolver(dato);
  } else {
    otaPendiente = dato;
  }
}

function esperarOta(ms) {
  if (otaPendiente) {
    const d = otaPendiente;
    otaPendiente = null;
    return Promise.resolve(d);
  }
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => {
      otaEspera = null;
      reject(new Error('el reloj no respondio'));
    }, ms);
    otaEspera = d => { clearTimeout(t); resolve(d); };
  });
}

function pintarBarra(hecho, total) {
  const pct = total ? Math.round(hecho * 100 / total) : 0;
  $('barra').style.width = pct + '%';
  return pct;
}

async function enviarFirmware(datos, nombre) {
  if (!chrOtaCtrl || !chrOtaData) throw new Error('el reloj no soporta ota');
  if (!conectado()) throw new Error('sin conexion');

  // La imagen va cifrada; su cabecera empieza por un magico fijo. Comprobarlo
  // evita descubrir el archivo equivocado tras dos minutos de transferencia.
  if (datos.length < 1024 || !OTA_MAGIC.every((b, i) => datos[i] === b)) {
    throw new Error('eso no es una imagen cifrada de bitcat watch');
  }

  otaEnCurso = true;
  otaPendiente = null;    // nada de arrastrar respuestas de un intento anterior
  pararTimers();          // el enlace es para el firmware, nada de hora ni clima
  setEstado('Actualizando', 'wait');
  $('progreso').hidden = false;
  pintarBarra(0, 1);
  log('ota', `${nombre}, ${Math.round(datos.length / 1024)} KB`);
  aviso('Actualizando el reloj, no lo desconectes', '', false);

  await chrOtaCtrl.startNotifications();
  chrOtaCtrl.addEventListener('characteristicvaluechanged', onOtaNotify);

  try {
    const inicio = new DataView(new ArrayBuffer(5));
    inicio.setUint8(0, OTA_START);
    inicio.setUint32(1, datos.length, true);

    // El receptor se arma antes de escribir, no despues: la respuesta del reloj
    // puede adelantarse a la confirmacion de la propia escritura.
    const esperaInicio = esperarOta(15000);
    await escribirCon(chrOtaCtrl, inicio);
    const listo = await esperaInicio;
    if (listo.estado !== OTA_LISTO) throw new Error('el reloj rechazo la actualizacion');
    log('ota', 'ranura preparada, enviando');

    /*
     * Con respuesta cuando el reloj la acepta: cada trozo espera a que el
     * anterior este grabado en flash, que es el unico control de flujo que hay.
     * Sin el, el celular sigue mandando mientras el reloj borra un sector y el
     * enlace se cae a media transferencia. Cuesta velocidad —unos 30 KB/s en vez
     * de 100— pero medio mega sigue tardando menos de medio minuto.
     *
     * Los relojes con firmware anterior solo declaran la escritura sin
     * respuesta, asi que se conserva ese camino.
     */
    const conFlujo = chrOtaData.properties && chrOtaData.properties.write;
    const enviarTrozo = conFlujo
      ? d => escribirCon(chrOtaData, d)
      : (chrOtaData.writeValueWithoutResponse
          ? d => chrOtaData.writeValueWithoutResponse(d)
          : d => chrOtaData.writeValue(d));
    log('ota', conFlujo ? 'enviando con control de flujo' : 'enviando sin control de flujo');

    let trozo = OTA_CHUNK_MAX, off = 0, ultimoPct = -1;
    while (off < datos.length) {
      const parte = datos.subarray(off, off + trozo);
      try {
        await enviarTrozo(parte);
      } catch (e) {
        // Si el enlace se cayo no hay trozo que valga: reintentar mas pequeño
        // solo esconderia la causa detras de una cascada de fallos.
        if (/disconnect/i.test(e.message) || !conectado()) {
          throw new Error(`se perdio el enlace al ${pintarBarra(off, datos.length)}%`);
        }
        /*
         * Partir el trozo solo arregla un problema: que el MTU negociado sea
         * menor del que pedimos. Y eso solo puede pasar antes de que entre el
         * primer byte. Si ya iba avanzando, o si el reloj rechaza hasta trozos
         * minusculos, el fallo es de otra cosa y partir mas solo entierra el
         * mensaje que dice cual.
         */
        if (off === 0 && trozo > OTA_CHUNK_MIN) {
          trozo = Math.floor(trozo / 2);
          log('ota', `el reloj rechazo ${parte.length} bytes (${e.message}), probando con ${trozo}`);
          continue;
        }
        throw new Error(`el reloj rechazo los datos al ${pintarBarra(off, datos.length)}%`
                      + ` (${e.message})`);
      }
      off += parte.length;

      const pct = pintarBarra(off, datos.length);
      if (pct !== ultimoPct && pct % 10 === 0) {
        log('ota', `${pct}%`);
        ultimoPct = pct;
      }
    }

    const esperaFin = esperarOta(20000);
    await escribirCon(chrOtaCtrl, new Uint8Array([OTA_END]));
    const fin = await esperaFin;
    if (fin.estado !== OTA_OK) throw new Error('la imagen no paso la validacion');

    pintarBarra(1, 1);
    log('ota', 'firmware aceptado, el reloj se reinicia', 'ok');
    aviso('Firmware instalado. El reloj se esta reiniciando.', 'ok', false);
  } catch (e) {
    // Cancelar libera la ranura. Si el enlace ya murio da igual que falle.
    try { await escribirCon(chrOtaCtrl, new Uint8Array([OTA_ABORT])); } catch (_) {}
    throw e;
  } finally {
    chrOtaCtrl.removeEventListener('characteristicvaluechanged', onOtaNotify);
    otaEnCurso = false;
  }
}

// Envuelve a enviarFirmware con lo comun a los dos origenes: bloquear la UI,
// registrar el fallo y devolver el estado al terminar.
async function lanzarOta(obtenerDatos) {
  otaEnCurso = true;
  refrescarOtaUi();
  try {
    const { datos, nombre } = await obtenerDatos();
    await enviarFirmware(datos, nombre);
  } catch (e) {
    log('err', 'ota: ' + e.message, 'err');
    $('progreso').hidden = true;
  } finally {
    otaEnCurso = false;
    // Tras un OTA bueno el reloj se reinicia y cae el enlace; la cadena de
    // reconexion de siempre lo recupera sola.
    setEstado(conectado() ? 'Conectado' : 'Desconectado', conectado() ? 'on' : '');
  }
}

/* ------------------------------------------------- firmware publicado */

// El .bin viaja junto a la pagina, asi que se pide al mismo origen: no hay CORS
// de por medio y no hace falta tener el archivo en el celular.
async function buscarFirmwarePublicado() {
  try {
    const r = await fetch('./firmware/firmware.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('sin publicar');
    firmwarePublicado = await r.json();
  } catch (e) {
    $('vPublicada').textContent = 'ninguna';
    refrescarOtaUi();
    return;
  }

  const f = new Date(firmwarePublicado.fecha);
  $('vPublicada').textContent =
    `${firmwarePublicado.version} (${f.toLocaleDateString()})`;
  log('ota', `publicada la ${firmwarePublicado.version}, `
            + `${Math.round(firmwarePublicado.bytes / 1024)} KB, `
            + `commit ${firmwarePublicado.commit}`);
  refrescarOtaUi();
}

// La version de la app sale del manifiesto, que ya se descarga igualmente: asi
// solo hay un sitio donde tocarla al publicar.
async function mostrarVersionApp() {
  try {
    const m = await (await fetch('./manifest.json')).json();
    if (m.version) $('pie').textContent = `BitCat Watch · app ${m.version}`;
  } catch (e) { /* da igual, es decorativo */ }
}

async function descargarFirmware() {
  log('ota', 'descargando el firmware publicado');
  const r = await fetch('./firmware/' + firmwarePublicado.archivo, { cache: 'no-store' });
  if (!r.ok) throw new Error('no se pudo descargar: HTTP ' + r.status);

  const datos = new Uint8Array(await r.arrayBuffer());
  if (datos.length !== firmwarePublicado.bytes) {
    throw new Error('la descarga vino incompleta');
  }

  // Una descarga corrupta no debe llegar nunca a escribirse en la flash, y a
  // estas alturas comprobarlo cuesta milisegundos.
  const hash = await crypto.subtle.digest('SHA-256', datos);
  const hex = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
  if (hex !== firmwarePublicado.sha256) {
    throw new Error('el sha256 no coincide, descarga corrupta');
  }
  log('ota', 'descarga verificada');

  return { datos, nombre: firmwarePublicado.archivo };
}

$('remoto').onclick = () => lanzarOta(descargarFirmware);

/* ------------------------------------------------------------------ pwa */

// El enlace BLE no necesita internet, asi que la app tiene que abrir sin red:
// poner el reloj en hora funciona offline, solo el clima requiere salir.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      aviso('Listo para usar sin conexion', 'ok');

      // Un service worker nuevo se queda en espera hasta que se cierran las
      // pestañas viejas; aqui se le pide el relevo y se recarga una sola vez.
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        nuevo?.addEventListener('statechange', () => {
          if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
            log('sys', 'version nueva descargada, aplicando');
            nuevo.postMessage('actualizar');
          }
        });
      });
    } catch (e) {
      log('err', 'offline no disponible: ' + e.message, 'err');
    }
  });

  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recargando) return;
    recargando = true;
    location.reload();
  });
}

// Chrome guarda el evento y muestra su propio banner; capturarlo permite poner
// el boton dentro de la pagina en vez de depender del menu del navegador.
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  promptInstalar = ev;
  $('instalar').hidden = false;
  aviso('Se puede instalar en la pantalla de inicio');
});

$('instalar').onclick = async () => {
  if (!promptInstalar) return;
  $('instalar').disabled = true;
  promptInstalar.prompt();
  const { outcome } = await promptInstalar.userChoice;
  log('sys', outcome === 'accepted' ? 'instalando' : 'instalacion cancelada');
  promptInstalar = null;
  $('instalar').hidden = true;
};

window.addEventListener('appinstalled', () => {
  $('instalar').hidden = true;
  aviso('App instalada', 'ok');
});

// Sin red el clima falla, pero la hora no: conviene que se vea la diferencia.
addEventListener('offline', () => aviso('Sin internet: el clima no se podra actualizar'));
addEventListener('online',  () => aviso('Internet restablecido', 'ok'));

pintarGato();
buscarFirmwarePublicado();
mostrarVersionApp();
aviso('Listo. Pulsa Conectar para poner el reloj en hora.');
if (!navigator.onLine) aviso('Sin internet: el clima no se podra actualizar');
</script>
