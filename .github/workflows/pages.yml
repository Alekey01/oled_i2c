name: Publicar webapp en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion a la vez; si llegan varios push seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Solo se sube webapp/, no el firmware.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - id: deploy
        uses: actions/deploy-pages@v4
