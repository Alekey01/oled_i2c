name: Publicar webapp en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'main/**'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'CMakeLists.txt'
      # Sin esta, subir la version no republicaba: la pagina seguiria ofreciendo
      # la anterior y diria que el reloj ya esta al dia.
      - 'version.txt'
      - 'ota_public_key.pem'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion a la vez; si llegan varios push seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Compilar y desplegar van separados a proposito. Si el despliegue falla y le
  # das a "Re-run failed jobs", solo se repite el despliegue: no se sube un
  # segundo artefacto con el mismo nombre, que es lo que hace que deploy-pages
  # se queje de "Multiple artifacts named github-pages".
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La clave privada se incrusta en el binario y nunca sale del reloj. Vive
      # en el secreto OTA_PRIVATE_KEY del repositorio, no en git.
      - name: Restaurar la clave privada del OTA
        env:
          CLAVE: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "Falta el secreto OTA_PRIVATE_KEY. Ver README, seccion OTA cifrado." >&2
            exit 1
          fi
          printf '%s\n' "$CLAVE" | tr -d '\r' > main/ota_private_key.pem

          # Un PEM al que se le hayan perdido los saltos de linea al copiarlo
          # sigue siendo un archivo con contenido, asi que el build no falla:
          # produce un firmware sin clave utilizable que solo se descubre cuando
          # una actualizacion muere en el primer trozo. Mejor reventar aqui.
          if ! openssl rsa -in main/ota_private_key.pem -check -noout; then
            echo "OTA_PRIVATE_KEY no es una clave RSA valida." >&2
            echo "Debe ser el PEM completo, con BEGIN/END y un salto por linea." >&2
            exit 1
          fi
          echo "clave valida, $(grep -c '' main/ota_private_key.pem) lineas"

      # Compilar aqui es lo que permite que la pagina ofrezca el firmware sin
      # tener que llevar el .bin al celular a mano.
      - name: Compilar el firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: '.'

      # Comprobar que la clave acabo DENTRO del binario. EMBED_TXTFILES no valida
      # el contenido del archivo, asi que un PEM mal formado se incrusta igual y
      # produce un reloj incapaz de descifrar ninguna actualizacion futura: un
      # fallo que no se ve hasta el siguiente OTA, y para entonces ya solo se
      # arregla por cable.
      - name: Comprobar que la clave quedo incrustada
        run: |
          python3 - <<'PY'
          import sys

          pem = open('main/ota_private_key.pem', 'rb').read().replace(b'\r\n', b'\n')
          cuerpo = [l for l in pem.split(b'\n') if l and not l.startswith(b'-----')]
          binario = open('build/oled_i2c.bin', 'rb').read()

          faltan = [l for l in cuerpo if l not in binario]
          print('lineas de la clave: %d, ausentes del binario: %d'
                % (len(cuerpo), len(faltan)))
          if faltan:
              sys.exit('La clave no esta en el firmware; no se publica nada.')
          PY

      - name: Cifrar y empaquetar el firmware junto a la pagina
        run: |
          pip install --quiet cryptography
          mkdir -p webapp/firmware

          # Lo que se publica es texto cifrado: descargarlo no sirve de nada sin
          # la clave privada, que solo esta dentro del reloj.
          python3 managed_components/espressif__esp_encrypted_img/tools/esp_enc_img_gen.py \
            encrypt build/oled_i2c.bin ota_public_key.pem webapp/firmware/oled_i2c.bin

          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone

          datos = open('webapp/firmware/oled_i2c.bin', 'rb').read()

          # La pagina compara este sha256 con lo que descarga: una descarga a
          # medias no debe llegar nunca a escribirse en la flash del reloj.
          meta = {
              'archivo': 'oled_i2c.bin',
              'version': open('version.txt').read().strip(),
              'bytes': len(datos),
              'sha256': hashlib.sha256(datos).hexdigest(),
              'commit': os.environ['GITHUB_SHA'][:7],
              'fecha': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          with open('webapp/firmware/firmware.json', 'w') as f:
              json.dump(meta, f, indent=2)
          print(json.dumps(meta, indent=2))
          PY

      # La clave no debe acabar en el artefacto que se publica en la web.
      - name: Borrar la clave privada
        if: always()
        run: rm -f main/ota_private_key.pem

      - uses: actions/configure-pages@v5

      # Solo se sube webapp/, ya con el firmware dentro.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
